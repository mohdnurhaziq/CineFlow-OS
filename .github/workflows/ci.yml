# Checks every push to main and every pull request: types, recorded database changes, and the
# full test suite. `node scripts/ops.mjs deploy staging` warns when a version isn't green here.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm db:check-migrations
      - name: pnpm test:e2e
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log
      # The full log needs a GitHub sign-in; annotations don't. Put the failures and the end of
      # the output there, so a red check can be read from anywhere.
      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          [ -f e2e.log ] || exit 0
          clean() { sed -E 's/\x1b\[[0-9;]*m//g' | tr -d '\r'; }
          grep -a "FAILED \[" e2e.log | clean | sort -u | head -n 8 | while IFS= read -r line; do
            echo "::error title=Test failed::${line}"
          done
          tail -n 40 e2e.log | clean | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=End of the test output::/'
          echo
