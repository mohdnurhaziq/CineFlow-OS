services:
  app:
    build:
      context: .
      args:
        # Read from your .env (falls back to localhost)
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN:-localhost:3000}
    image: cineflow-os:latest
    container_name: cineflow-os
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides .env so the database lives on the persistent volume
      DATABASE_URL: file:/app/data/dev.db
      NODE_ENV: production
    volumes:
      - cineflow-data:/app/data              # SQLite database
      - cineflow-uploads:/app/public/uploads # user uploads (logos, previews…)
      - cineflow-storage:/app/storage        # private deliverable masters
    depends_on:
      - mailpit

  # Development mail catcher: accepts every email the app sends and shows it in a web inbox
  # at http://localhost:8025. It never delivers to real inboxes. Use it with
  # SMTP_HOST="mailpit" SMTP_PORT="1025" in .env; switch to a real provider for production.
  mailpit:
    image: axllent/mailpit:v1.21.0
    container_name: cineflow-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web inbox (this computer only)
      - "127.0.0.1:1025:1025" # SMTP, for `pnpm dev` running outside Docker
    environment:
      MP_MAX_MESSAGES: 1000

volumes:
  cineflow-data:
  cineflow-uploads:
  cineflow-storage:
