# CineFlow OS runs as three copies, each from its own folder with its own .env:
#   dev         this PC          http://localhost:3000   demo data
#   staging     the 24/7 PC      staging.<domain>        demo data, test inbox, test payments
#   production  the 24/7 PC      app.<domain>            real data, nightly backups
# The .env in the folder you run `docker compose` from picks the copy: COMPOSE_PROJECT_NAME keeps
# each copy's containers and data apart, APP_PORT/APP_BIND set where it listens, and
# COMPOSE_PROFILES switches on the extras (mail, tunnel, domain, backup). Dev leaves
# COMPOSE_PROJECT_NAME unset. See README → "Staging and production".
services:
  app:
    build:
      context: .
      args:
        # Read from your .env (fall back to dev values). Fixed into the build, so a change needs a rebuild.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN:-localhost:3000}
        APP_ENV: ${APP_ENV:-development}
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Overrides .env so the database lives on the persistent volume
      DATABASE_URL: file:/app/data/dev.db
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
    # Shows as "unhealthy" in `docker compose ps` (and ops.mjs status) when the app isn't
    # answering, e.g. when production refused its settings: the reason is in `docker compose logs app`.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3m
    volumes:
      - cineflow-data:/app/data              # SQLite database
      - cineflow-uploads:/app/public/uploads # user uploads (logos, previews…)
      - cineflow-storage:/app/storage        # private deliverable masters

  # Test mail catcher (profile "mail": dev and staging): accepts every email the app sends and
  # shows it in a web inbox at http://localhost:${MAILPIT_PORT}. It never delivers to real
  # inboxes. Use it with SMTP_HOST="mailpit" SMTP_PORT="1025" in .env.
  mailpit:
    image: axllent/mailpit:v1.21.0
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"      # web inbox (this computer only)
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP, for `pnpm dev` running outside Docker
    environment:
      MP_MAX_MESSAGES: 1000

  # Public https address for testing, through a free Cloudflare quick tunnel (no account).
  # Off by default; start it with:  docker compose up -d tunnel
  # The address (https://<random>.trycloudflare.com) is in:  docker compose logs tunnel
  # It changes each time the tunnel restarts. Anyone with it can open the app.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app

  # Your own domain, through a named Cloudflare tunnel (profile "domain": staging and
  # production). Create the tunnel in the Cloudflare dashboard, point its public hostname at
  # http://app:3000, and put its token in .env as TUNNEL_TOKEN. Each copy has its own tunnel.
  domain-tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["domain"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

  # Backups (profile "backup": production). Runs every night at BACKUP_TIME in TZ, and on
  # demand through `node scripts/ops.mjs backup now`. Writes to BACKUP_DIR; see docker/backup.
  # Each backup is checked the way a restore needs it. A failed nightly backup, or free space
  # below BACKUP_MIN_FREE_GB, asks the app to email the super-admins (test: ops.mjs test-alert).
  backup:
    build: ./docker/backup
    profiles: ["backup"]
    restart: unless-stopped
    command: daemon
    environment:
      APP_ENV: ${APP_ENV:-development} # recorded in each backup, so restore refuses another copy's
      AUTH_SECRET: ${AUTH_SECRET:-} # makes the key for failed-backup alerts (never sent itself)
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_MIN_FREE_GB: ${BACKUP_MIN_FREE_GB:-5}
    volumes:
      - cineflow-data:/data
      - cineflow-uploads:/uploads
      - cineflow-storage:/storage
      - ${BACKUP_DIR:-./backups}:/backups
      - ./:/project:ro # reads .cineflow-deployed.json to record which version each backup ran

volumes:
  cineflow-data:
  cineflow-uploads:
  cineflow-storage:
